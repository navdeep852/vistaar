<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Vistaar_Icon_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VISTAAR — Run Better. Grow Wider. The Business OS for Growing Businesses" />
    <meta property="og:title" content="VISTAAR — Run Better. Grow Wider." />
    <meta property="og:description" content="The Business OS for Growing Businesses" />
    <meta property="og:image" content="/Vistaar_Logo_With_Name.png" />
    <title>VISTAAR — Run Better. Grow Wider.</title>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('vistaar_theme');
          if (!storedTheme) {
            var rawState = localStorage.getItem('vistaar_app_state_v2');
            if (rawState) {
              var parsed = JSON.parse(rawState);
              if (parsed && parsed.settings && parsed.settings.theme) {
                storedTheme = parsed.settings.theme;
              }
            }
          }
          if (storedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        window.addEventListener('error', function (e) {
          console.error('[VISTAAR Global Error]', e.error || e.message);
          var root = document.getElementById('root');
          if (root && !root.hasChildNodes()) {
            root.innerHTML = '<div style="padding:2rem;font-family:system-ui,sans-serif;max-width:600px;margin:2rem auto;background:#fff;border:1px solid #e2e8f0;border-radius:1rem;box-shadow:0 10px 25px -5px rgba(0,0,0,0.1);"><h2 style="color:#e11d48;margin-top:0;">VISTAAR Application Initialization Error</h2><p style="color:#475569;font-size:14px;">An unexpected error occurred during application startup.</p><pre style="background:#0f172a;color:#f8fafc;padding:1rem;border-radius:0.5rem;font-size:12px;overflow-x:auto;">' + (e.error ? (e.error.stack || e.error.message) : e.message) + '</pre><button onclick="window.location.reload()" style="background:#2563eb;color:#fff;border:none;padding:0.6rem 1.2rem;border-radius:0.5rem;font-weight:bold;cursor:pointer;margin-top:1rem;">Reload Application</button></div>';
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
